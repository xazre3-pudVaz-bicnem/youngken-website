name: Daily blog post

# 記事は GitHub のリポジトリにコミットして永続化する。
# Vercel は main への push を検知して自動デプロイするので、
# Vercel 側で記事ファイルを書く必要はない（書いても再デプロイで消える）。

on:
  schedule:
    # 毎日 10:20 JST（01:20 UTC）
    - cron: '20 1 * * *'
  workflow_dispatch:
    inputs:
      posts:
        description: '生成する本数（1〜7）。2以上にすると記事がない直近の日を古い順に埋めます'
        required: false
        default: '1'

permissions:
  contents: write

concurrency:
  group: daily-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY が未登録です。Settings > Secrets and variables > Actions で登録してください。"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POSTS: ${{ github.event.inputs.posts || '1' }}
        run: node scripts/generate-blog-post.mjs

      - name: Verify build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain content/blog)" ]; then
            echo "No new post. Nothing to commit."
            exit 0
          fi
          git config user.name "yangken-bot"
          git config user.email "actions@github.com"
          git add content/blog
          git commit -m "blog: $(TZ=Asia/Tokyo date +'%Y-%m-%d') の記事を追加"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
